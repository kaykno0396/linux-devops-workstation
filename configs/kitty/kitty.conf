############################################################
# Kay's DevOps Kitty Theme
############################################################

############################################################
# Font
############################################################

font_family                 JetBrains Mono
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
font_size                   10.0

############################################################
# Cursor
############################################################

cursor                      #88c0d0
cursor_text_color           #003b46
cursor_shape                beam
cursor_blink_interval       0.5

############################################################
# Main colours
############################################################

background                  #073642
foreground                  #d8dee9

selection_background        #285b66
selection_foreground        #ffffff

url_color                   #5ec4d6
url_style                   single

############################################################
# ANSI colour palette
############################################################

color0                      #002b36
color8                      #52666c

color1                      #ef6f6c
color9                      #ff8785

color2                      #8fbc8f
color10                     #a3d9a5

color3                      #d9b65d
color11                     #f0cf75

color4                      #5f9ea0
color12                     #74b9c5

color5                      #b48ead
color13                     #cda8c7

color6                      #56b6c2
color14                     #7ed6df

color7                      #d8dee9
color15                     #ffffff

############################################################
# Scrollback
############################################################

scrollback_lines            100000
wheel_scroll_multiplier     5.0

############################################################
# Window layout
############################################################

window_padding_width        4
remember_window_size        yes
initial_window_width        1200
initial_window_height       750

background_opacity          1.0
dynamic_background_opacity  no

############################################################
# Tab bar
############################################################

tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          "{index}: {title}"

tab_bar_background          #002b36
active_tab_background       #5f9ea0
active_tab_foreground       #002b36
inactive_tab_background     #123f49
inactive_tab_foreground     #aebbc1

############################################################
# Terminal behaviour
############################################################

enable_audio_bell           no
visual_bell_duration        0.0
confirm_os_window_close     0
copy_on_select              no
strip_trailing_spaces       smart

############################################################
# Remote/xRDP-friendly rendering
############################################################

sync_to_monitor             no
repaint_delay               10
input_delay                 3

############################################################
# Clipboard shortcuts
############################################################

map ctrl+shift+c             copy_to_clipboard
map ctrl+shift+v             paste_from_clipboard

############################################################
# New windows and tabs
############################################################

map ctrl+shift+enter         new_window
map ctrl+shift+t             new_tab
map ctrl+shift+w             close_tab

############################################################
# Splits
############################################################

map ctrl+shift+backslash     launch --location=vsplit
map ctrl+shift+minus         launch --location=hsplit

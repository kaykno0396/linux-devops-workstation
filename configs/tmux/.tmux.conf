############################################################
# Kay's DevOps tmux Configuration
############################################################

# Keep the standard prefix
set -g prefix C-b

############################################################
# General
############################################################

# Mouse support
set -g mouse on

# Large scrollback
set -g history-limit 100000

# Faster escape timing
set -sg escape-time 10

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows
set -g renumber-windows on

############################################################
# Vi-style copy mode
############################################################

setw -g mode-keys vi

############################################################
# Reload config
############################################################

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

############################################################
# Status bar
############################################################

set -g status-position bottom
set -g status-interval 5

set -g status-style "bg=colour236,fg=white"

set -g status-left-length 40
set -g status-left "#[fg=cyan]#S "

set -g status-right "#[fg=green]%Y-%m-%d #[fg=yellow]%H:%M"

############################################################
# Window style
############################################################

setw -g window-status-current-style fg=cyan,bold
setw -g window-status-current-format " #I:#W "

setw -g window-status-format " #I:#W "

############################################################
# Terminal
############################################################

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:RGB"
